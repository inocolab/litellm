services:
  litellm:
    build:
      context: .
      args:
        target: runtime
    image: docker.litellm.ai/berriai/litellm:main-stable
    container_name: litellm_container  # Add this for easier reference
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: "postgresql://llmproxy:dbpassword9090@postgresSugi:5432/litellm"
      STORE_MODEL_IN_DB: "True"
    env_file:
      - .env
    networks:
      - shared-network
    command:
      - "--config=/app/config.yaml" 
    volumes:
      - ./config.yaml:/app/config.yaml   # 👈 mount the config
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  prometheus:
    image: prom/prometheus
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    restart: always
    networks:
      - shared-network

networks:
  shared-network:
    name: shared-network
    external: true

volumes:
  prometheus_data:
    driver: local
